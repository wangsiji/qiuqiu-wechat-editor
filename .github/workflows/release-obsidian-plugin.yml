name: Release Obsidian plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web deps
        run: npm ci

      - name: Install plugin deps
        working-directory: obsidian-plugin
        run: npm install

      - name: Build plugin
        working-directory: obsidian-plugin
        run: npm run build

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release
          cp obsidian-plugin/main.js obsidian-plugin/manifest.json obsidian-plugin/styles.css release/
          # manifest.json 里 version 必须与 tag 一致，做一次校验
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p 'require("./release/manifest.json").version')"
          if [ "$RELEASE_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error:: manifest version ($MANIFEST_VERSION) != tag ($RELEASE_VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: release/main.js,release/manifest.json,release/styles.css
          artifactContentType: application/javascript,application/json,text/css
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}